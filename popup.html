<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Extractor Popup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 380px; min-height: 480px; background-color: #f8fafc; color: #0f172a; font-size: 13px; }
    
    header { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .logo-group { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 22px; h-22px; background: #3b82f6; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 12px; }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .badge { background: #3b82f6; color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }

    .action-bar { padding: 10px 14px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; }
    button { cursor: pointer; border: none; font-size: 12px; font-weight: 500; border-radius: 6px; padding: 8px 12px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: #2563eb; color: white; flex: 1; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .btn-danger:hover { background: #fca5a5; }

    .search-box { padding: 8px 14px; background: white; border-bottom: 1px solid #e2e8f0; }
    .search-input { width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; }
    .search-input:focus { border-color: #2563eb; }

    .list-container { max-height: 330px; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .lead-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .lead-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .lead-name { font-weight: 600; font-size: 13px; color: #1e293b; text-decoration: none; }
    .lead-name:hover { color: #2563eb; }
    .lead-title { color: #475569; font-size: 11px; margin-bottom: 2px; }
    .lead-company { color: #64748b; font-size: 11px; font-weight: 500; }
    .lead-email { margin-top: 6px; font-family: monospace; font-size: 11px; color: #0284c7; background: #f0f9ff; padding: 3px 6px; border-radius: 4px; word-break: break-all; display: inline-block; }
    .email-generated { color: #d97706; background: #fffbebf; }

    .empty-state { text-align: center; padding: 30px 20px; color: #64748b; }
    .empty-state svg { width: 36px; height: 36px; stroke: #94a3b8; margin-bottom: 8px; }

    footer { padding: 8px 14px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; }
    .link { color: #2563eb; text-decoration: none; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="logo-group">
      <div class="logo-icon">L</div>
      <h1>Lead Extractor</h1>
    </div>
    <span id="leadCountBadge" class="badge">0 Leads</span>
  </header>

  <div class="action-bar">
    <button id="scrapeBtn" class="btn-primary">
      ⚡ Refresh & Scrape Page
    </button>
    <button id="exportCsvBtn" class="btn-secondary">
      📥 Export CSV
    </button>
    <button id="clearBtn" class="btn-danger" title="Clear Leads">
      🗑️
    </button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Filter by name, title or company...">
  </div>

  <div id="leadsList" class="list-container">
    <div class="empty-state">
      <p>No leads extracted yet.</p>
      <p style="font-size: 11px; margin-top: 4px;">Navigate to Google Search or LinkedIn to extract profiles automatically.</p>
    </div>
  </div>

  <footer>
    <span>Manifest V3 Active</span>
    <a href="options.html" target="_blank" class="link">Settings</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
