<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lead Extractor Options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #1e293b; background: #f8fafc; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #0f172a; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    button { background: #2563eb; color: white; padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .status { margin-left: 12px; font-size: 13px; color: #16a34a; font-weight: 500; }
  </style>
</head>
<body>
  <h1>⚙️ Lead Extractor Settings</h1>
  <div class="card">
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="generateEmailPattern" checked>
        Enable Email Pattern Generator (first.last@company.com fallback)
      </label>
    </div>
    <div class="field">
      <label>Default Fallback Email Domain</label>
      <input type="text" id="defaultEmailDomain" placeholder="e.g. acme.com (leave blank for auto company domain)">
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="autoScrapeOnScroll" checked>
        Auto Scrape on Dynamic Scroll (MutationObserver)
      </label>
    </div>
    <div>
      <button id="saveBtn">Save Settings</button>
      <span id="status" class="status"></span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
